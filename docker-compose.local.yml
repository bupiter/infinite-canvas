services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile.local
    ports:
      - "3000:3000"
    environment:
      VOTE_IMAGE_ASSET_ORIGIN: ${VOTE_IMAGE_ASSET_ORIGIN:-}
      VOTE_CONNECT_ORIGINS: ${VOTE_CONNECT_ORIGINS:-}
      VOTE_MEDIA_ORIGINS: ${VOTE_MEDIA_ORIGINS:-}
    restart: unless-stopped
