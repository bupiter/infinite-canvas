add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; frame-ancestors 'self' https://ai.vote520.com; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://image.vote520.com blob: data: __VOTE_IMAGE_ASSET_ORIGIN__ __VOTE_CONNECT_ORIGINS__; img-src 'self' blob: data: __VOTE_IMAGE_ASSET_ORIGIN__ __VOTE_MEDIA_ORIGINS__; media-src 'self' blob: data: __VOTE_IMAGE_ASSET_ORIGIN__ __VOTE_MEDIA_ORIGINS__; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
